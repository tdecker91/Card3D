name: Package and Release Godot Asset

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v' (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move License to Addon Folder for Packaging
        run: |
          # Move LICENSE from the root into the addon folder 
          # so it is located inside the addon package structure for the zip.
          mkdir -p addons/card_3d
          mv LICENSE addons/card_3d/LICENSE.txt

      - name: Create Asset Zip Archive
        run: |
          # Extract the version tag (e.g., v1.0.0) from the GitHub Actions environment
          VERSION=${GITHUB_REF_NAME}
          
          # Create a staging directory named after the asset and version (e.g., card_3d-v1.0.0)
          STAGING_DIR="card_3d-${VERSION}"
          mkdir -p "${STAGING_DIR}"
          
          # Copy your exported folders into the versioned staging directory
          cp -r addons example example_battle example_solitaire "${STAGING_DIR}/"
          
          # Zip up that versioned folder so users get a clean root folder when extracting
          zip -r "${STAGING_DIR}.zip" "${STAGING_DIR}" -x "*.git*"
          
          # Save the final zip filename to an environment variable for the release step
          echo "ZIP_FILE=${STAGING_DIR}.zip" >> $GITHUB_ENV
        
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_FILE }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
