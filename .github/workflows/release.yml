name: Package and Release Godot Asset

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v' (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move License to Addon Folder for Packaging
        run: |
          # Move LICENSE.txt from the root into the addon folder 
          # so it is located inside the addon package structure for the zip.
          mkdir -p addons/card_3d
          mv LICENSE addons/card_3d/LICENSE.txt

      - name: Create Asset Zip Archive
        run: |
          # Create a zip containing only the folders/files you want to export,
          # explicitly including your addons, examples, and the moved license.
          zip -r card_3d-asset.zip addons example example_battle example_solitaire -x "*.git*"
        
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: card_3d-asset.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
