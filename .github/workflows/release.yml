name: Package and Release Godot Asset

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy License to Addon Folder
        run: |
          # Keep LICENSE.txt in the root directory for source control viewing, 
          # but copy it into the addon folder so it gets bundled correctly 
          # inside the Godot Asset Library zip package.
          mkdir -p addons/card_3d
          mv LICENSE.txt addons/card_3d/LICENSE.txt

      - name: Create Asset Zip Archive
        run: |
          # Use git archive to export only the files that respect your .gitattributes export-ignore rules,
          # including the newly copied license.
          git add addons/card_3d/LICENSE.txt
          git archive --format=zip --output=card_3d-asset.zip HEAD

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: card_3d-asset.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
